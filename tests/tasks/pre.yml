# pre test file
---
- name: pre | install dependencies
  ansible.builtin.apt:
    name:
      - "python{{ ansible_python_version_major is version('3', '>=') | ternary('3', '') }}"
      - curl
    state: "{{ apt_install_state | default('latest') }}"
    update_cache: true
    cache_valid_time: "{{ apt_update_cache_valid_time | default(3600) }}"

- name: pre | install pip  # noqa command-instead-of-module
  ansible.builtin.shell: >
    curl -sL {{ ansible_get_pip_url }} | python{{ ansible_python_version_major | string }} -
  when: (ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] is version('24.04', '<')) or
        (ansible_facts['distribution'] == 'Debian')
  changed_when: false
  tags:
    - skip_ansible_lint

- name: pre | remove ansible
  ansible.builtin.pip:
    name: ansible
    executable: "{{ ansible_pip_executable }}"
    state: absent
